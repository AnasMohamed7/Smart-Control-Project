[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#141821"
textColor = "#eef0f4"
borderColor = "#262c3a"
showWidgetBorder = true
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap, system-ui, sans-serif"
headingFontWeights = [800, 700, 650, 600, 600, 600]
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap, monospace"

[server]
headless = false
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
